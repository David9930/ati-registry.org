name: "Withdraw or report a record"
description: "Withdraw your record, or report a problem with a record."
title: "[Record] "
labels: ["record-update"]
body:
  - type: markdown
    attributes:
      value: "Use this form to **withdraw** your own record, to **report a problem** with any record, or to request a **correction** to your own record. This request is public. Do not include private information. See [how disputes work](https://ati-registry.org/disputes/)."
  - type: input
    id: record_id
    attributes:
      label: "Record ID"
      placeholder: "ATI-2026-000001"
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: "What would you like to do?"
      options:
        - "Withdraw my record"
        - "Report a problem with this record"
        - "Request a correction to my record"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: "Details"
      description: "What is inaccurate, with evidence where you can, or why you are withdrawing or correcting."
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: "Confirmation"
      options:
        - label: "I understand this request is public."
          required: true
