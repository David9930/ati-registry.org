name: registry

# Processes registration issues, commits the new records, rebuilds and deploys the site, then answers the submitters.
# Runs are serialized (one at a time) so IDs are assigned in order. GitHub keeps only one *pending* run per
# concurrency group, so an hourly sweep also processes any issue whose own run was superseded, and the `approved`
# label (added by a maintainer to release a held submission) triggers a run as well.
#
# Least privilege: each job gets only the token permissions it needs, and the only job that can write to the
# repository (`intake`) never runs the site generator.
on:
  issues:
    types: [opened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: registry
  cancel-in-progress: false

permissions: {}

jobs:
  intake:
    # Issue events only matter when an issue is opened or a maintainer applies `approved`.
    if: github.event_name != 'issues' || github.event.action == 'opened' || github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit new records to main
      issues: read      # list open issues
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Process submissions (writes records only; nothing is announced yet)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m ati.intake process
      - name: Commit and push records
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "ati-registry-bot"
          git config user.email "ati-registry-bot@users.noreply.github.com"
          git add records
          if git diff --cached --quiet; then
            echo "No record changes."
            exit 0
          fi
          git commit -m "Registry: update records"
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          # The token is passed per command and never written to .git/config.
          gitauth() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" "$@"; }
          gitauth pull --rebase origin main
          gitauth push origin HEAD:main
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: results
          path: results.json
          if-no-files-found: ignore

  build:
    needs: intake
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main   # includes the records pushed by the intake job
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m ati.build --out dist --strict
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  notify:
    # Answers submitters only after their records are safely pushed. Independent of the site deploy.
    needs: intake
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true   # no artifact when there was nothing to report
        with:
          name: results
          path: .
      - name: Answer submitters
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m ati.intake notify
